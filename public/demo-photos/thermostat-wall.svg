<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="100%" height="100%" fill="#1e1e24"/>
  <!-- Wall Surface -->
  <rect x="20" y="20" width="360" height="260" rx="8" fill="#3f3f46"/>
  <!-- Thermostat Baseplate -->
  <circle cx="200" cy="130" r="75" fill="#18181b" stroke="#71717a" stroke-width="4"/>
  <circle cx="200" cy="130" r="60" fill="#09090b"/>
  <!-- Temperature Display -->
  <text x="200" y="145" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="38" font-weight="bold" text-anchor="middle">
    72°
  </text>
  <!-- Label -->
  <text x="200" y="235" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
    WALL THERMOSTAT UPGRADE (SAMPLE)
  </text>
  <text x="200" y="260" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">
    Existing 4-wire standard analog thermostat
  </text>
</svg>
