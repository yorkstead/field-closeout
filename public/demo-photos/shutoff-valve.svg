<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="100%" height="100%" fill="#1e293b"/>
  <!-- Pipe Body -->
  <rect x="40" y="130" width="320" height="40" rx="4" fill="#64748b"/>
  <rect x="30" y="125" width="20" height="50" rx="2" fill="#475569"/>
  <rect x="350" y="125" width="20" height="50" rx="2" fill="#475569"/>
  <!-- Valve Body -->
  <circle cx="200" cy="150" r="45" fill="#d97706"/>
  <circle cx="200" cy="150" r="35" fill="#b45309"/>
  <!-- Valve Stem & Handle -->
  <rect x="192" y="70" width="16" height="50" fill="#78350f"/>
  <rect x="130" y="55" width="140" height="22" rx="6" fill="#dc2626"/>
  <!-- Corrosion Spots -->
  <circle cx="185" cy="160" r="8" fill="#15803d" opacity="0.8"/>
  <circle cx="215" cy="145" r="6" fill="#15803d" opacity="0.8"/>
  <circle cx="170" cy="140" r="5" fill="#047857" opacity="0.7"/>
  <!-- Label -->
  <text x="200" y="240" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
    CORRODED SHUTOFF VALVE (SAMPLE)
  </text>
  <text x="200" y="265" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">
    Packing nut weep • 3/4-in brass ball valve
  </text>
</svg>
