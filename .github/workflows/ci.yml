name: CI

on:
  pull_request:
    branches: [next, main]
  push:
    branches: [next]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: field_closeout
          POSTGRES_PASSWORD: field_closeout_dev
          POSTGRES_DB: field_closeout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://field_closeout:field_closeout_dev@localhost:5432/field_closeout_test
      APP_RUNTIME_MODE: local

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun install --frozen-lockfile
          else
            bun install
          fi
      - name: Migrate and seed test database
        run: bun run db:migrate && bun run db:seed
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run verify gate
        run: bun run verify
